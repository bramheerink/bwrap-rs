[package]
name = "bwrap-cli"
description = "Command-line parsing for bwrap-rs: byte-compatible with bubblewrap's argument grammar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bwrap-core = { path = "../bwrap-core" }
bwrap-sys = { path = "../bwrap-sys" }
nix = { workspace = true, features = ["fs", "user"] }

# The `bwrap` binary: the orchestration entry point (module 11).
[[bin]]
name = "bwrap"
path = "src/main.rs"

# Module 13: drop-in differential + security-regression acceptance. Needs user
# namespaces and the built binary; SKIPs where namespaces are unavailable.
[[test]]
name = "differential"
harness = false

[lints]
workspace = true
