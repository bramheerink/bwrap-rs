# cargo-fuzz harness crate. Tooling only, nightly-only, detached from the main
# workspace (its own empty [workspace] below + `exclude = ["fuzz"]` in the root),
# so libfuzzer-sys never enters the runtime crates' dependency tree. Run with:
#   cargo +nightly fuzz run parse
#   cargo +nightly fuzz run seccomp
[package]
name = "bwrap-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bwrap-cli = { path = "../crates/bwrap-cli" }
bwrap-core = { path = "../crates/bwrap-core" }
bwrap-sys = { path = "../crates/bwrap-sys" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seccomp"
path = "fuzz_targets/seccomp.rs"
test = false
doc = false
bench = false

# Detach from the root workspace.
[workspace]
